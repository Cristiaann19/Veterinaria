<section id="reviews" class="bg-white py-32 px-6 text-gray-900">
  <div class="max-w-7xl mx-auto">

    <div class="text-center mb-20">
      <span class="!font-mono text-xs uppercase tracking-[0.3em] text-gray-500 mb-4 block">Comunidad</span>
      <h2 class="text-5xl md:text-7xl !font-display font-bold">Lo que dicen de Nosotros</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (re of revs; track i; let i = $index) {
        <div class="p-8 bg-white border border-gray-200 rounded-2xl flex flex-col justify-between hover:border-gray-300 hover:shadow-sm transition-all group">

          <span class="!font-mono text-4xl text-gray-300 group-hover:text-gray-400 transition-colors mb-4 block">"</span>

          <p class="text-base italic text-gray-600 leading-relaxed mb-8">{{ re.descripcion }} </p>

          <div class="flex items-center gap-4 border-t border-gray-100 pt-6">
            <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center font-mono text-sm text-gray-600">
              {{ re.usuario.charAt(0).toUpperCase() }}
            </div>
            <div>
              <h4 class="!font-display text-base">{{ re.usuario }}</h4>
              <p class="text-[10px] uppercase tracking-widest text-gray-400">{{ re.fecha }}</p>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
